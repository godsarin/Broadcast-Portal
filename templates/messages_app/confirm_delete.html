{% extends 'base.html' %}
{% block title %}Delete Message{% endblock %}
{% block page_title %}Messages{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-danger">
            <div class="card-body text-center py-5">
                <i class="bi bi-trash text-danger" style="font-size:2.5rem;"></i>
                <h5 class="mt-3">Delete this message?</h5>
                <p class="text-muted small">Subject: <strong>{{ msg.subject }}</strong></p>
                <p class="text-muted small">This action cannot be undone.</p>
                <div class="d-flex gap-2 justify-content-center mt-4">
                    <form method="post" action="{% url 'delete_message' msg.pk %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Yes, Delete
                        </button>
                    </form>
                    <a href="{% url 'inbox' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Cancel Meeting{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-danger">
            <div class="card-body text-center py-5">
                <i class="bi bi-x-circle text-danger" style="font-size:2.5rem;"></i>
                <h5 class="mt-3">Cancel this meeting?</h5>
                <p class="text-muted">{{ meeting.title }}<br>{{ meeting.date_time|date:"D d M Y, H:i" }}</p>
                <div class="d-flex gap-2 justify-content-center mt-4">
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Yes, Cancel Meeting</button>
                    </form>
                    <a href="{% url 'meeting_detail' meeting.pk %}" class="btn btn-outline-secondary">Go Back</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Reset Password - Broadcast Portal{% endblock %}

{% block auth_content %}
<div class="card shadow-lg" style="width: 420px;">
    <div class="card-body p-5">
        <div class="text-center mb-4">
            <div class="mb-3">
                <i class="bi bi-key-fill text-primary" style="font-size:2.5rem;"></i>
            </div>
            <h4 class="fw-bold">Reset Password</h4>
            <p class="text-muted small">Enter your email address and we'll send you a reset link.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label fw-medium">Email Address</label>
                <input type="email" 
                       name="email" 
                       class="form-control" 
                       placeholder="Enter your registered email"
                       autofocus
                       required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-envelope me-2"></i>Send Reset Link
            </button>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted small mb-0">
            <a href="{% url 'login' %}" class="text-primary fw-medium">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}

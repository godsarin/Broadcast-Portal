{% extends 'base.html' %}
{% block title %}Email Sent - Broadcast Portal{% endblock %}

{% block auth_content %}
<div class="card shadow-lg" style="width: 420px;">
    <div class="card-body p-5">
        <div class="text-center mb-4">
            <div class="mb-3">
                <i class="bi bi-envelope-check-fill text-success" style="font-size:2.5rem;"></i>
            </div>
            <h4 class="fw-bold">Check Your Email</h4>
            <p class="text-muted small">
                If an account with that email exists, a reset link has been sent.
                Check your inbox and spam folder.
            </p>
        </div>
        <a href="{% url 'login' %}" class="btn btn-outline-primary w-100 py-2">
            <i class="bi bi-arrow-left me-2"></i>Back to Login
        </a>
    </div>
</div>
{% endblock %}

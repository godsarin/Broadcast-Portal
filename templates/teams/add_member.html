{% extends 'base.html' %}
{% block title %}Add Member{% endblock %}
{% block page_title %}Add Member{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-white py-3">
                <h6 class="mb-0 fw-semibold">Add Member to {{ team.name }}</h6>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-medium small">User</label>
                        {{ form.user }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-medium small">Role</label>
                        {{ form.role }}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-person-plus me-2"></i>Add
                        </button>
                        <a href="{% url 'team_detail' team.pk %}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
